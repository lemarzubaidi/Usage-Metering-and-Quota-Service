services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metering}
      POSTGRES_DB: ${POSTGRES_DB:-metering}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metering} -d ${POSTGRES_DB:-metering}"]
      interval: 3s
      timeout: 3s
      retries: 20

  service:
    build: ./service
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-metering}:${POSTGRES_PASSWORD:-metering}@db:5432/${POSTGRES_DB:-metering}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me}
      PORT: 3000
    mem_limit: 256m
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  client:
    build: ./client
    environment:
      SERVICE_URL: http://service:3000
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me}
    depends_on:
      service:
        condition: service_healthy
    restart: "no"

  tests:
    profiles: ["test"]
    build:
      context: ./service
      target: build
    command: ["npm", "test"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-metering}:${POSTGRES_PASSWORD:-metering}@db:5432/${POSTGRES_DB:-metering}
    depends_on:
      db:
        condition: service_healthy

  loadtest:
    profiles: ["load"]
    build: ./loadtest
    environment:
      SERVICE_URL: http://service:3000
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me}
    depends_on:
      service:
        condition: service_healthy

volumes:
  pgdata:
