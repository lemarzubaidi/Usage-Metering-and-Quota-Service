services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metering}
      POSTGRES_DB: ${POSTGRES_DB:-metering}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metering} -d ${POSTGRES_DB:-metering}"]
      interval: 3s
      timeout: 3s
      retries: 20

  service:
    build: ./service
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-metering}:${POSTGRES_PASSWORD:-metering}@db:5432/${POSTGRES_DB:-metering}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key-change-me}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
